<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<title>Europa em fevereiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body data-aba="viagem">
<div class="app">

  <!-- VIAGEM: as paradas e as noites em cada uma; as ideias ficam na página de cada cidade -->
  <section id="v-viagem" class="view" aria-label="Viagem">
    <header class="topo"><div><small>18/02 → 08/03/2027 · 18 noites</small><h1>Europa em fevereiro</h1></div></header>
    <div class="sec">
      <div class="lista caminho" id="caminho"></div>
      <h2>Antes de ir</h2>
      <ul class="checks" id="checks"></ul>
    </div>
    <p class="rodape">Pesquisas de 30/09/2026. Fotos: Wikimedia Commons, licenças livres (autor em cada foto). Horários e preços mudam: confiram antes de pagar.</p>
  </section>

  <!-- MAPA: a viagem inteira num mapa só (mapa.js) -->
  <section id="v-mapa" class="view" aria-label="Mapa" hidden>
    <div class="mapa-v">
      <nav class="filtro" id="m-cidades" aria-label="Cidade"></nav>
      <div id="m-mapa" class="mapa" role="img" aria-label="Mapa da viagem"></div>
    </div>
    <div class="folha"><div class="alca"></div><h2 id="m-titulo"></h2><small id="m-sub"></small>
      <nav class="filtro m-tipos" id="m-tipos" aria-label="Tipo"></nav><div id="m-lista"></div></div>
  </section>

  <!-- PASSAGENS: cada voo e trem, na ordem da viagem, com a situação da compra -->
  <section id="v-passagens" class="view" aria-label="Passagens" hidden>
    <header class="topo"><div><small id="p-sub"></small><h1>Passagens</h1></div></header>
    <div id="p-topo"></div>
    <div id="p-lista" class="agenda"></div>
  </section>

  <!-- INGRESSOS: atrações que pedem ingresso ou reserva, na ordem em que a venda abre -->
  <section id="v-ingressos" class="view" aria-label="Ingressos" hidden>
    <header class="topo"><div><small>o que pede ingresso ou reserva</small><h1>Ingressos</h1></div></header>
    <div id="c-topo"></div>
    <div id="c-agenda" class="agenda"></div>
  </section>

  <!-- COMER -->
  <section id="v-comer" class="view" aria-label="Onde comer" hidden>
    <header class="topo"><div><small id="k-sub"></small><h1>Onde comer</h1></div></header>
    <nav class="filtro" id="k-cidades" aria-label="Cidade"></nav>
    <nav class="filtro" id="k-tipos" aria-label="Tipo"></nav>
    <div class="sec"><div id="k-lista"></div></div>
  </section>
</div>

<nav class="tabbar" id="tabbar" aria-label="Menu"></nav>
<script src="tabbar.js"></script>

<!-- FICHA (bottom sheet) -->
<div class="ficha-fundo" id="ficha-fundo" hidden></div>
<div class="ficha" id="ficha" role="dialog" aria-modal="true" aria-label="Detalhes do lugar" hidden></div>

<script src="dados/guia.js"></script>
<script src="viagem.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const G = window.GUIA;
const HEX = {madri:"#c2410c",roma:"#b45309",verona:"#9333ea",innsbruck:"#0e7490",viena:"#1d4ed8",budapeste:"#15803d"};
const NOME = Object.fromEntries(G.cidades);
const DIA_SEM = ["dom","seg","ter","qua","qui","sex","sáb"];
const dm = iso => iso.slice(8,10)+"/"+iso.slice(5,7);
const sem = iso => DIA_SEM[new Date(iso+"T12:00:00Z").getUTCDay()];
const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const porId = {}; Object.values(G.lugares).flat().forEach(x => porId[x.id] = x);
const curto = n => n.replace(/\s*\(.*$/,"").replace(/\s+[—–]\s+.*$/,"").replace(/\s+\+\s+.*$/,"");
const usados = new Set(G.usados);
const ideias = c => [...G.lugares[c]].sort(ordemIdeias(usados));
function capaDe(c){ const l = ideias(c); const x = l.find(x => x.foto && x.tipo==="ver") || l.find(x => x.foto); return x ? x.foto : null; }
// última cidade escolhida em qualquer aba
function cidadeGuardada(){ try { const c = sessionStorage.getItem("cidade"); return NOME[c] ? c : null; } catch(e){ return null; } }
function guardaCidade(c){ try { if (NOME[c]) sessionStorage.setItem("cidade", c); } catch(e){} }

// ---------- VIAGEM ----------
function renderViagem(){
  const parada = ([c,a,b]) => { const f = capaDe(c), n = noites(a,b);
    return `<a class="it linha parada" href="cidade.html?c=${c}" style="--cor:var(--${c})">${f?`<img class="th" src="${f.url}" alt="" loading="lazy">`:`<span class="th"></span>`}<span class="tx"><b>${NOME[c]}</b><small>${periodo(a,b)} · ${G.lugares[c].length} ideias</small></span><span class="noites">${n} ${n===1?"noite":"noites"}</span></a>`; };
  document.getElementById("caminho").innerHTML = PARADAS.map(parada).join("");
  const CHECKS = [["Seguro viagem Schengen","mínimo €30 mil"],["ETIAS","se já estiver valendo"],["Passaporte","válido até junho/2027"],["eSIM europeu","vale nos 4 países"],["Roupa de frio de verdade","Innsbruck abaixo de zero"]];
  document.getElementById("checks").innerHTML = CHECKS.map(([t,s]) => `<li><b>${t}</b><span>${s}</span></li>`).join("");
}

// ---------- rotas ----------
function ir(view, param){ location.hash = param ? `#/${view}/${param}` : `#/${view}`; }
function rota(){
  let h = location.hash.replace(/^#\/?/,"");
  // links antigos: #/dia/…, #dia-…, #/cidades, #compras, #transporte, #orcamento, #checklist
  if (/^(dia|cidades|checklist)\b/.test(h)) h = "viagem";
  if (/^(compras|comprar|orcamento)$/.test(h)) h = "ingressos";
  if (h === "transporte") h = "passagens";
  let [view, param] = h.split("/");
  const v = ["viagem","mapa","passagens","ingressos","comer"].includes(view) ? view : "viagem";
  if (param && NOME[param]) guardaCidade(param);
  document.querySelectorAll(".view").forEach(s => s.hidden = s.id !== "v-"+v);
  // a barra é a mesma em todas as páginas (tabbar.js); aqui só marca a aba. Aberto o mapa, a aba dele volta a apontar para "onde eu estava".
  document.querySelectorAll(".tabbar a").forEach(a => { a.classList.toggle("on", a.dataset.v===v); if (v==="mapa" && a.dataset.v==="mapa") a.href = "index.html#/mapa"; });
  if (v==="viagem") renderViagem();
  if (v==="mapa") renderMapa(NOME[param] ? param : null);
  if (v==="passagens") renderPassagens();
  if (v==="ingressos") renderIngressos();
  if (v==="comer") renderComer(param);
  if (v!=="mapa") document.documentElement.style.setProperty("--cor", "#b45309");
}
addEventListener("hashchange", () => { rota(); if (!location.hash.startsWith("#/mapa")) scrollTo(0,0); });
</script>
<script src="conteudo.js"></script>
<script src="comer.js"></script>
<script src="mapa.js"></script>
<script>rota();</script>
</body>
</html>
