<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Onde dormir · Europa 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
<style>
  .voltar{display:inline-flex;margin:14px 18px 0;font-size:.9rem;color:var(--ink2);text-decoration:none}
  .nota-c{margin:12px 18px 0;background:var(--warn-bg);border-radius:14px;padding:10px 13px;font-size:.88rem;color:var(--ink2)}
  .h-it{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:11px 14px;text-decoration:none;color:inherit;border-top:1px solid var(--soft)}
  .h-it:first-child{border-top:0}
  .h-it img,.h-it .ph{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--soft)}
  .h-it b{display:block;font-size:.93rem;line-height:1.25}
  .h-it small{display:block;color:var(--ink3);font-size:.79rem;line-height:1.35}
  .h-it .pp{text-align:right;font-weight:700;font-size:.95rem;white-space:nowrap}
  .h-it .pp small{font-weight:500}
  .todos{margin-top:10px}
  .todos summary{cursor:pointer;list-style:none;font-weight:600;color:var(--cor);padding:4px 2px}
  .todos summary::-webkit-details-marker{display:none}
</style>
</head>
<body>
<div class="app">
  <a class="voltar" href="index.html#/cidades">‹ Cidades</a>
  <header class="topo"><div><small id="sub"></small><h1>Onde dormir</h1></div></header>
  <nav class="filtro" id="cidades" aria-label="Parada"></nav>
  <p class="nota-c" id="nota"></p>
  <div class="sec" id="painel"></div>
  <p class="rodape">Busca no Airbnb e no Booking em 30/09/2026, para 5 pessoas nas datas do roteiro. Preço com taxas. Muda toda semana: reservem com cancelamento grátis.</p>
</div>

<nav class="tabbar" aria-label="Menu">
  <a href="index.html#/dia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Dia a dia</a>
  <a href="index.html#/mapa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>Mapa</a>
  <a href="index.html#/comprar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16l-1.5 11a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2zM9 7a3 3 0 0 1 6 0"/></svg>Comprar</a>
  <a href="index.html#/comer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 2v9a2 2 0 0 0 2 2v9M7 2v6M11 2v6M17 2c-2 2-2 6 0 8v12"/></svg>Comer</a>
  <a href="index.html#/cidades" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Cidades</a>
</nav>

<script src="hospedagens-dados.js"></script>
<script>
const H = window.HOSP || [];
const HEX = {"madri-ida":"#c2410c",roma:"#b45309",verona:"#9333ea",innsbruck:"#0e7490",viena:"#1d4ed8",budapeste:"#15803d","madri-volta":"#c2410c"};
const NOTA = {
  "madri-ida": "Chegada à meia-noite: confirmem check-in autônomo antes de reservar.",
  "roma": "No Airbnb, a taxa turística (~€6 por pessoa por noite) é paga na chegada.",
  "verona": "Cidade pequena: tudo a até 2 km da Arena.",
  "innsbruck": "Uma noite só: fiquem perto da estação de trem.",
  "viena": "Nos hotéis baratos, confiram se o 5º dorme em sofá-cama.",
  "budapeste": "A parada mais barata da viagem.",
  "madri-volta": "O ideal é o mesmo apartamento da chegada, para guardar as malas.",
};
const reais = v => "R$ " + Math.round(v).toLocaleString("pt-BR");
const dm = iso => iso.slice(8,10)+"/"+iso.slice(5,7);
const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const bom = x => x.tipo==="airbnb" ? (x.nota||0)>=4.7 && x.aval>=15 : (x.nota||0)>=8.2 && x.aval>=150;
let atual = H[0]?.chave;
try { const s = sessionStorage.getItem("hosp"); if (H.some(c=>c.chave===s)) atual = s; } catch(e){}
function linha(x){
  const nota = x.nota ? (x.tipo==="hotel" ? x.nota.toLocaleString("pt-BR",{minimumFractionDigits:1}) : x.nota.toLocaleString("pt-BR")) : "";
  const sub = [x.tipo==="airbnb"?"Airbnb":"Hotel", nota?`★ ${nota}`:"", x.km_centro!=null?`${x.km_centro.toLocaleString("pt-BR")} km do centro`:""].filter(Boolean).join(" · ");
  return `<a class="h-it" href="${x.url}" target="_blank" rel="noopener">${x.foto?`<img src="${x.foto}" alt="" loading="lazy" referrerpolicy="no-referrer">`:`<span class="ph"></span>`}
    <span><b>${esc(x.nome)}</b><small>${sub}</small></span><span class="pp num">${reais(x.pp)}<small>pessoa/noite</small></span></a>`;
}
function mostra(){
  const c = H.find(x=>x.chave===atual);
  document.documentElement.style.setProperty("--cor", HEX[c.chave] || "#b45309");
  document.getElementById("cidades").innerHTML = H.map(x => `<button type="button" class="${x.chave===atual?"on":""}" data-k="${x.chave}">${x.nome.replace(" — ", " · ")}</button>`).join("");
  document.querySelectorAll("#cidades button").forEach(b => b.onclick = () => { atual = b.dataset.k; try { sessionStorage.setItem("hosp", atual); } catch(e){} mostra(); });
  document.getElementById("sub").textContent = `${dm(c.ent)} → ${dm(c.sai)} · ${c.noites} ${c.noites>1?"noites":"noite"} · 5 pessoas`;
  document.getElementById("nota").textContent = NOTA[c.chave] || "";
  const top = t => c.itens.filter(x => x.tipo===t && bom(x)).sort((a,b) => a.pp-b.pp);
  const ab = top("airbnb"), ht = top("hotel");
  const resto = c.itens.filter(x => bom(x)).sort((a,b) => a.pp-b.pp);
  document.getElementById("painel").innerHTML = `
    <div class="grupo"><b>Airbnb · os 3 bons mais baratos</b></div><div class="lista">${ab.slice(0,3).map(linha).join("") || '<p class="fraco" style="padding:12px 14px">Nenhum com nota boa.</p>'}</div>
    <div class="grupo"><b>Hotel · os 3 bons mais baratos</b></div><div class="lista">${ht.slice(0,3).map(linha).join("") || '<p class="fraco" style="padding:12px 14px">Nenhum com nota boa.</p>'}</div>
    <details class="todos"><summary>Ver todos os ${resto.length} com nota boa ›</summary><div class="lista" style="margin-top:8px">${resto.map(linha).join("")}</div></details>`;
  const on = document.querySelector("#cidades .on"); if (on) on.scrollIntoView({inline:"center", block:"nearest"});
}
mostra();
</script>
</body>
</html>
