<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cidade · Europa 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
<style>
  .voltar{display:inline-flex;align-items:center;gap:4px;margin:14px 18px 0;font-size:.9rem;color:var(--ink2);text-decoration:none}
  .capa-c{margin:10px 18px 0;border-radius:24px;overflow:hidden;position:relative;height:230px;background:var(--cor)}
  .capa-c img{width:100%;height:100%;object-fit:cover}
  .capa-c .txt{position:absolute;inset:auto 0 0 0;padding:60px 18px 14px;background:linear-gradient(transparent,rgb(16 24 40/.88));color:#fff}
  .capa-c small{font-size:.86rem;opacity:.92}.capa-c h1{margin:0;font-size:2.3rem;line-height:1;letter-spacing:-.025em}
  .capa-c .credito{position:absolute;top:12px;left:12px;font-size:.64rem;color:#fff;background:rgb(16 24 40/.5);border-radius:6px;padding:2px 6px;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .capa-c .play{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:6px;background:rgb(16 24 40/.6);backdrop-filter:blur(6px);color:#fff;border:0;border-radius:999px;padding:8px 13px;font:600 .85rem "Outfit",sans-serif;cursor:pointer}
  .capa-c .play svg{width:14px;height:14px}
  .transp{margin:12px 18px 0;background:var(--card);border:1px solid var(--soft);border-radius:18px;padding:12px 14px}
  .transp b{font-size:1rem}
  .transp small{display:block;color:var(--ink3);font-size:.84rem;margin-top:2px}
  .mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .mini span{background:var(--soft);border-radius:8px;padding:4px 9px;font-size:.8rem;color:var(--ink2)}
  .grade-f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .fc{display:block;text-align:left;background:var(--card);border:1px solid var(--soft);border-radius:16px;overflow:hidden;padding:0;cursor:pointer;font:inherit;color:inherit}
  .fc img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--soft)}
  .fc div{padding:8px 10px 10px}
  .fc b{display:block;font-size:.88rem;line-height:1.2}
  .fc small{color:var(--ink3);font-size:.76rem}
  .dicas{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  .dicas li{background:var(--card);border:1px solid var(--soft);border-left:4px solid var(--cor);border-radius:14px;padding:10px 13px;color:var(--ink2);font-size:.92rem}
  .dicas-t{margin:16px 2px 8px;font-size:.95rem}
  .ref{background:var(--card);border:1px solid var(--soft);border-radius:18px;padding:12px;margin-top:8px}
  .ref-cab{padding:2px 4px 10px}.ref-cab b{display:block;font-size:1rem}.ref-cab small{color:var(--ink3);font-size:.84rem}
  .ref-cab a{color:var(--cor)}
  .prints{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
  .print{display:block;text-decoration:none;min-width:0;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
  .mais-prints{margin-top:12px}.mais-prints summary{cursor:pointer;list-style:none;font-weight:600;font-size:.9rem;color:var(--cor);padding:2px 4px 10px}
  .mais-prints summary::-webkit-details-marker{display:none}.mais-prints[open] summary{display:none}
  .print img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:12px;background:var(--soft)}
  .print b{display:block;margin-top:6px;font-size:.92rem;line-height:1.2}
  .print small{display:block;color:var(--ink3);font-size:.78rem;line-height:1.3}
  .ref.um{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start}
  .ref.um .ref-cab{padding:0}
  .ref.um .ref-cab p{margin:6px 0 0;color:var(--ink2);font-size:.86rem;line-height:1.4}
  .ref.um .ref-cab .lugar{display:inline;font-size:.86rem}
  .ref-obs{margin:12px 4px 2px;color:var(--ink3);font-size:.84rem}
  @media (min-width:760px){.prints{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body data-aba="viagem">
<div class="app">
  <a class="voltar" href="index.html#/viagem">‹ Viagem</a>
  <div id="capa"></div>
  <div id="transp"></div>
  <div class="seg" id="seg" role="tablist"></div>
  <div class="sec"><div id="painel"></div></div>
</div>

<nav class="tabbar" id="tabbar" aria-label="Menu"></nav>
<script src="tabbar.js"></script>

<div class="ficha-fundo" id="ficha-fundo" hidden></div>
<div class="ficha" id="ficha" role="dialog" aria-modal="true" aria-label="Detalhes do lugar" hidden></div>

<!-- STORIES: as ideias da cidade que têm foto -->
<div class="stories" id="stories" role="dialog" aria-modal="true" aria-label="A cidade em stories">
  <div class="palco" id="st-palco"></div>
</div>

<script src="dados/guia.js"></script>
<script src="viagem.js"></script>
<script>
const G = window.GUIA;
const HEX = {madri:"#c2410c",roma:"#b45309",verona:"#9333ea",innsbruck:"#0e7490",viena:"#1d4ed8",budapeste:"#15803d"};
const NOME = Object.fromEntries(G.cidades);
const DIA_SEM = ["dom","seg","ter","qua","qui","sex","sáb"];
const dm = iso => iso.slice(8,10)+"/"+iso.slice(5,7);
const sem = iso => DIA_SEM[new Date(iso+"T12:00:00Z").getUTCDay()];
const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const curto = n => n.replace(/\s*\(.*$/,"").replace(/\s+[—–]\s+.*$/,"").replace(/\s+\+\s+.*$/,"");
const porId = {}; Object.values(G.lugares).flat().forEach(x => porId[x.id] = x);
const p = new URLSearchParams(location.search).get("c");
const c = NOME[p] ? p : "roma";
document.title = `${NOME[c]} · Europa 2027`;
document.documentElement.style.setProperty("--cor", HEX[c]);
const aba_ = v => document.querySelector(`.tabbar a[data-v="${v}"]`);
if (aba_("comer")) aba_("comer").href = `index.html#/comer/${c}`;
if (aba_("mapa")) aba_("mapa").href = `index.html#/mapa/${c}`;
try { sessionStorage.setItem("cidade", c); } catch(e){}
</script>
<script src="comer.js"></script>
<script>
const lug = G.lugares[c];
const usados = new Set(G.usados);
// ainda sem roteiro: só as noites de cada estada e as ideias, a lista de vocês primeiro
const ordem = ordemIdeias(usados);
const est = estadias(c);

// capa
const capa = [...lug].sort(ordem).find(x => x.foto && x.tipo==="ver") || lug.find(x => x.foto);
document.getElementById("capa").innerHTML = `<div class="capa-c">${capa?`<img src="${capa.foto.url}" alt=""><span class="credito">Foto: ${esc(capa.foto.autor)} · ${esc(capa.foto.licenca)}</span>`:""}
  <button class="play" type="button" id="abrir-stories"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg> Stories</button>
  <div class="txt"><small>${noitesDe(c)} · ${est.map(p => periodo(p[1],p[2])).join(" e ")}</small><h1>${NOME[c]}</h1></div></div>`;

// transporte: uma caixa só
const TRANSP = {
  madri:["Metrô","1 cartão Multi para os 5, com bilhetes de 10 viagens",["Aeroporto: táxi ~€33","10 viagens €7,30","Muito a pé"]],
  roma:["Metrô e ônibus","Avulso €1,50 por aproximação, cada um com o seu cartão",["Aeroporto: táxi €55 fixo","Teto de €8,50 por dia","Passe não compensa"]],
  verona:["A pé","O centro é pequeno; ônibus só com mala",["Ônibus €1,50","Veneza: vaporetto €9,50"]],
  innsbruck:["A pé","Estação e centro a poucos minutos",["Sem bilhete de transporte"]],
  viena:["Metrô e bonde","Passe de 24h por pessoa nos dias de muito metrô",["24h €9,70","U1 até Stephansplatz","U4 até Schönbrunn"]],
  budapeste:["Metrô","Blocos de 10 bilhetes, que o grupo usa junto",["Aeroporto: Bolt XL ~€35","M2 até o Parlamento","Moeda: florim"]],
};
const T = TRANSP[c];
if (T) document.getElementById("transp").innerHTML = `<div class="transp"><b>${T[0]}</b><small>${T[1]}</small><div class="mini">${T[2].map(t=>`<span>${t}</span>`).join("")}</div></div>`;

// abas
const ver = lug.filter(x => x.tipo==="ver").sort(ordem);
const comer = lug.filter(x => x.tipo==="comer").sort(ordem);
const dicas = (G.dicas||{})[c] || [];
const refs = (G.refs||{})[c] || [];
const ABAS = [["ver","Para ver"],["comer","Para comer ›"]].concat(refs.length ? [["refs","Referências"]] : []).concat(dicas.length ? [["dicas","Dicas"]] : []);
function linha(x){ const tp = x.tipo==="comer" ? tipoComida(x) : null;
  return `<button type="button" class="it linha" data-ficha="${x.id}">${x.foto?`<img class="th" src="${x.foto.url}" alt="" loading="lazy" style="object-fit:cover">`:`<span class="th ${tp||"ver"}">${iconeComida(tp||"ver")}</span>`}<span class="tx"><b>${esc(curto(x.nome))}</b><small>${esc(umaFrase(x.pedir) || umaFrase(x.categoria) || (x.metro?`Metrô ${x.metro.nome}`:""))}</small></span></button>`; }
function painel(aba){
  document.querySelectorAll("#seg button").forEach(b => b.classList.toggle("on", b.dataset.a===aba));
  const el = document.getElementById("painel");
  if (aba==="ver") {
    const comFoto = ver.filter(x=>x.foto), semFoto = ver.filter(x=>!x.foto);
    el.innerHTML = `<div class="grade-f" style="margin-top:6px">${comFoto.map(x => `<button type="button" class="fc" data-ficha="${x.id}"><img src="${x.foto.url}" alt="" loading="lazy"><div><b>${esc(curto(x.nome))}</b></div></button>`).join("")}</div>
      ${semFoto.length?`<h3 class="dicas-t">Mais</h3><div class="lista">${semFoto.map(linha).join("")}</div>`:""}`;
  }
  if (aba==="dicas") el.innerHTML = `${dicas.length?`<h3 class="dicas-t">De quem já foi</h3><ul class="dicas">${dicas.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:""}`;
  // prints de posts que mandaram, com o nome de cada lugar e o crédito de quem postou
  // post com vários lugares: grade de prints; com um print só: cartão compacto
  if (aba==="refs") {
    // print de lugar que está no guia abre a ficha dele; os outros abrem a imagem. Post longo mostra 4 e guarda o resto.
    const print = (f, texto) => { const dentro = `<img src="${f.arq}" alt="${esc(f.nome)}" loading="lazy">${texto?`<b>${esc(f.nome)}</b><small>${esc(f.nota)}</small>`:""}`;
      return f.id ? `<button type="button" class="print" data-ficha="${f.id}">${dentro}</button>` : `<a class="print" href="${f.arq}" target="_blank" rel="noopener">${dentro}</a>`; };
    el.innerHTML = refs.map(r => { const cab = `<b>${esc(r.titulo)}</b><small>${esc(r.autor)} no ${esc(r.rede)} · <a href="${r.url}" target="_blank" rel="noopener">ver o post</a></small>`;
      if (!r.fotos.length) return `<div class="ref"><div class="ref-cab" style="padding-bottom:2px">${cab}</div>${r.obs?`<p class="ref-obs" style="margin-top:6px">${esc(r.obs)}</p>`:""}</div>`;
      if (r.fotos.length === 1) { const f = r.fotos[0];
        return `<div class="ref um">${print(f, false)}<div class="ref-cab">${cab}<p><b class="lugar">${esc(f.nome)}</b>${f.nota?" · "+esc(f.nota):""}</p>${r.obs?`<p>${esc(r.obs)}</p>`:""}</div></div>`; }
      const resto = r.fotos.slice(4);
      return `<div class="ref"><div class="ref-cab">${cab}</div><div class="prints">${r.fotos.slice(0,4).map(f => print(f, true)).join("")}</div>
        ${resto.length?`<details class="mais-prints"><summary>Mostrar os outros ${resto.length}</summary><div class="prints">${resto.map(f => print(f, true)).join("")}</div></details>`:""}
        ${r.obs?`<p class="ref-obs">${esc(r.obs)}</p>`:""}</div>`; }).join("");
  }
  try { sessionStorage.setItem("aba-cidade", aba); } catch(e){}
}
document.getElementById("seg").innerHTML = ABAS.map(([k,n]) => `<button type="button" data-a="${k}">${n}</button>`).join("");
document.querySelectorAll("#seg button").forEach(b => b.onclick = () => { if (b.dataset.a === "comer") location.href = `index.html#/comer/${c}`; else painel(b.dataset.a); });
let abaIni = "ver"; try { const s = sessionStorage.getItem("aba-cidade"); if (s !== "comer" && ABAS.some(a=>a[0]===s)) abaIni = s; } catch(e){}
painel(abaIni);
// link antigo cidade.html?c=roma#id → abre a ficha do lugar
if (location.hash && porId[location.hash.slice(1)]) { const id = location.hash.slice(1); painel("ver"); abrirFicha(id); }

// ---------- stories: uma ideia com foto por tela ----------
let stI = 0, stArrasto = 0;
const stSlides = ver.filter(x => x.foto).slice(0, 15);   // só atrações, as 15 primeiras: a comida tem a sua aba
function abrirStories(){
  const palco = document.getElementById("st-palco");
  palco.style.setProperty("--cor", HEX[c]);
  palco.innerHTML = stSlides.map((x,k) => `<div class="slide" data-k="${k}"><img class="bg" src="${x.foto.url}" alt="">
      <div class="txt"><span class="rot">${x.tipo==="comer"?"Para comer":"Para ver"}</span><h2>${esc(curto(x.nome))}</h2><p>${esc(umaFrase(x.dica) || umaFrase(x.pedir) || umaFrase(x.categoria))}</p>
        ${x.metro?`<div class="m">Metrô ${esc(x.metro.nome)} · ${x.metro.min} min a pé</div>`:""}</div><span class="credito">Foto: ${esc(x.foto.autor)}</span></div>`).join("")
    + `<div class="sombra-top"></div><div class="barras">${stSlides.map(()=>"<i></i>").join("")}</div>
       <div class="quem"><span>${NOME[c][0]}</span>${NOME[c]} · ${noitesDe(c)}</div>
       <button class="fechar" type="button" aria-label="Fechar">×</button>
       <button class="zona esq" type="button" aria-label="Anterior"></button><button class="zona dir" type="button" aria-label="Próximo"></button>`;
  palco.querySelector(".fechar").onclick = fecharStories;
  // depois de arrastar, o clique que vem junto não conta (senão avançava duas vezes com o mouse)
  palco.querySelector(".zona.esq").onclick = () => { if (Date.now() - stArrasto > 350) passo(-1); };
  palco.querySelector(".zona.dir").onclick = () => { if (Date.now() - stArrasto > 350) passo(1); };
  stI = 0; mostra();
  document.getElementById("stories").classList.add("on");
  document.body.style.overflow = "hidden";
}
function mostra(){
  document.querySelectorAll("#st-palco .slide").forEach((s,k) => s.classList.toggle("on", k===stI));
  document.querySelectorAll("#st-palco .barras i").forEach((b,k) => { b.className = k<stI ? "feito" : (k===stI ? "agora" : ""); });
}
function passo(n){ const k = stI + n; if (k < 0) return; if (k >= stSlides.length) { fecharStories(); return; } stI = k; mostra(); }
function fecharStories(){ document.getElementById("stories").classList.remove("on"); document.body.style.overflow = ""; }
document.getElementById("abrir-stories").onclick = abrirStories;
document.addEventListener("keydown", e => { if (!document.getElementById("stories").classList.contains("on")) return;
  if (e.key==="Escape") fecharStories(); if (e.key==="ArrowRight") passo(1); if (e.key==="ArrowLeft") passo(-1); });
(function(){ let x0 = null; const el = document.getElementById("stories");
  el.addEventListener("pointerdown", e => x0 = e.clientX);
  el.addEventListener("pointerup", e => { if (x0 === null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 50) { stArrasto = Date.now(); passo(dx < 0 ? 1 : -1); } });
})();
</script>
</body>
</html>
