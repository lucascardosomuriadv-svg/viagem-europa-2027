<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Futebol · Europa 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
<style>.voltar{display:inline-flex;margin:14px 18px 0;font-size:.9rem;color:var(--ink2);text-decoration:none}.jg{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px 14px;border-top:1px solid var(--soft)}.jg:first-child{border-top:0}.jg .dt{border-radius:12px;background:var(--soft);text-align:center;padding:6px 0;line-height:1.05;height:fit-content}.jg .dt b{display:block;font-size:1.25rem}.jg .dt small{font-size:.72rem;color:var(--ink3);font-weight:600}.jg h3{margin:0;font-size:1rem;line-height:1.25}.jg p{margin:2px 0 0;color:var(--ink3);font-size:.82rem}.jg .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.tg{font-size:.74rem;font-weight:700;border-radius:7px;padding:3px 8px}.tg.prov{background:var(--warn-bg);color:var(--warn)}.tg.poss{background:var(--soft);color:var(--ink2)}.tg.ok{background:var(--ok-bg);color:var(--ok)}</style>
</head>
<body data-aba="ingressos">
<div class="app">
  <a class="voltar" href="index.html#/ingressos">‹ Ingressos</a>
  <header class="topo"><div><small>só 1ª divisão · a data é a da rodada; dia e hora saem em janeiro</small><h1>Futebol</h1></div></header>
  <div class="sec" id="painel"></div>
  <p class="rodape">Pesquisa de 30/09/2026. Dia e hora exatos saem 3 a 5 semanas antes de cada jogo.</p>
</div>
<nav class="tabbar" id="tabbar" aria-label="Menu"></nav>
<script src="tabbar.js"></script>
<script src="dados/guia.js"></script>
<script>
const G = window.GUIA;
const NOME = Object.fromEntries(G.cidades);
const DIA_SEM = ["dom","seg","ter","qua","qui","sex","sáb"], MES3 = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const dm = iso => iso.slice(8,10)+"/"+iso.slice(5,7);
const sem = iso => DIA_SEM[new Date(iso+"T12:00:00Z").getUTCDay()];
const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const curto = n => n.replace(/\s*\(.*$/,"").replace(/\s+[—–]\s+.*$/,"").replace(/\s+\+\s+.*$/,"");
const porId = {}; Object.values(G.lugares).flat().forEach(x => porId[x.id] = x);
</script>
<script>
const F = G.futebol || {jogos:[]};
const ORDEM = ["madri","roma","verona","innsbruck","viena","budapeste"];
const st = s => { s = (s||"").toLowerCase(); if (s.startsWith("confirm") && !s.includes("provis")) return ["ok","data firme"]; if (s.includes("provis") || s.startsWith("confronto")) return ["prov","data provisória"]; return ["poss","possível"]; };
const limpa = t => String(t||"").replace(/\s*(EA Sports|Enilive|Admiral|OTP Bank Liga)\s*/g," ").replace(/\s+/g," ").trim();
// uma frase curta: corta no primeiro ponto ou em ~90 caracteres, sem quebrar palavra
const curta = (t, n = 90) => { t = String(t||"").replace(/\s*\([^)]*\)/g, "").split(/(?<=[.;:])\s/)[0].replace(/[.;:]$/, "");
  return t.length <= n ? t : t.slice(0, t.lastIndexOf(" ", n)) + "…"; };
const encaixe = t => curta(String(t||"").replace(/^MELHOR ENCAIXE[^:]*:\s*/i, ""));
const hora = h => { const m = String(h||"").match(/\d{1,2}:\d{2}/); return m ? (/prov/i.test(h) ? "provável " : "") + m[0] : ""; };
const jogos = [...F.jogos].sort((a,b) => ORDEM.indexOf(a.cidade)-ORDEM.indexOf(b.cidade) || a.data.localeCompare(b.data));
const grupos = []; jogos.forEach(j => { const u = grupos[grupos.length-1]; if (u && u.c===j.cidade) u.l.push(j); else grupos.push({c:j.cidade, l:[j]}); });
document.getElementById("painel").innerHTML = grupos.map(g => `<div class="grupo"><b>${esc(NOME[g.c]||g.c)}</b></div><div class="lista">${g.l.map(j => { const [cl, rt] = st(j.status);
  return `<div class="jg"><div class="dt"><b>${+j.data.slice(8)}</b><small>${MES3[+j.data.slice(5,7)-1]}</small></div><div><h3>${esc(curto(j.mandante))} × ${esc(curto(j.visitante))}</h3><p>${esc(limpa(j.competicao))} · ${esc(curto(j.estadio||""))}${hora(j.hora) ? " · " + hora(j.hora) : ""}</p><div class="tags"><span class="tg ${cl}">${rt}</span></div>${j.encaixe?`<p style="margin-top:6px;color:var(--ink2)">${esc(encaixe(j.encaixe))}</p>`:""}</div></div>`; }).join("")}</div>`).join("") || '<p class="fraco">Sem jogos.</p>';
</script>
</body>
</html>
